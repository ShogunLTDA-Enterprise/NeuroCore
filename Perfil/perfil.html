<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | NeuroCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/Perfil/style.css">
    <link rel="stylesheet" href="/configurações/config.css">
</head>
<body>

    <header class="header-topo">
        <div class="header-esquerda">
            <div class="logo-container">
                <a href="/index.html"><img class="icone_site" src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1).png" alt="Logo NeuroCore"></a>
                <span class="logo-texto">Neuro<strong>Core</strong></span>
            </div>
            <nav class="menu-navegacao">
                <ul>
                    <li class="item-barra"><a href="/projetos/projetos.html"><span class="icone"><i class="bi bi-house"></i></span><span class="txt-link">Projetos</span></a></li>
                    <li class="item-barra"><a href="/progresso/progresso.html"><span class="icone"><i class="bi bi-table"></i></span><span class="txt-link">Kanban</span></a></li>
                    <li class="item-barra"><a href="/Mensagens/Mensagens.html"><span class="icone"><i class="bi bi-envelope"></i></span><span class="txt-link">Mensagens</span></a></li>
                    <li class="item-barra"><a href="/Calendario/calendario.html"><span class="icone"><i class="bi bi-clock"></i></span><span class="txt-link">Atividades</span></a></li>
                </ul>
            </nav>
        </div>
        <div class="header-direita">
            <div class="usuario-topo">
                <a href="/Perfil/perfil.html" aria-label="Menu do usuário"><i class="bi bi-person-circle icone-usuario-branco" id="btn-usuario" onclick="toggleMenu(event)"></i></a>
                <ul class="dropdown-menu" id="menuUsuario">
                    <li><a href="/Perfil/perfil.html"><i class="bi bi-person"></i> Meu Perfil</a></li>
                    <li><a href="/configurações/Conta.html"><i class="bi bi-gear"></i> Configurações</a></li>
                    <li><a href="/Login/login.html" data-sair><i class="bi bi-box-arrow-right"></i> Sair</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="config-layout">
        <aside class="config-menu" aria-label="Menu de configurações">
            <h2>Configurações</h2>
            <a href="/configurações/Conta.html">Conta</a>
            <a href="/Perfil/perfil.html" aria-current="page">Perfil</a>
        </aside>

        <main class="config-conteudo">
            <h1>Perfil</h1>
            <p class="config-sub">É assim que os outros veem você nos projetos.</p>

            <section class="config-card" aria-labelledby="titulo-perfil">
                <h2 id="titulo-perfil">Seus dados</h2>
                <form id="form-perfil" class="config-form" novalidate>
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" maxlength="100" required autocomplete="name">
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" readonly>
                    </div>
                    <p id="feedback-perfil" class="feedback" role="status" hidden></p>
                    <div class="acoes">
                        <button type="submit" class="btn-config" id="btn-perfil">Salvar</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="/configurações/config.js"></script>
    <script src="/Perfil/perfil.js" defer></script>
</body>
</html>

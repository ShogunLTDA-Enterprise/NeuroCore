<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/progresso/style.css">
    <link rel="stylesheet" href="CSS/calendario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
   <header class="header-topo">
        <div class="header-esquerda">
            <div class="logo-container">
                <img class="icone_site" src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1).png" alt="icone" id="btn-exp">
                <span class="logo-texto">Neuro<strong>Core</strong></span>
            </div>
            
            <nav class="menu-navegacao">
                <ul>
                    <li class="item-barra">
                        <a href="/projetos/projetos.html">
                            <span class="icone"><i class="bi bi-house"></i></span>
                            <span class="txt-link">Projetos</span>
                        </a>
                    </li>
                    <li class="item-barra">
                        <a href="/progresso/progresso.html">
                            <span class="icone"><i class="bi bi-table"></i></span>
                            <span class="txt-link">Progresso</span>
                        </a>
                    </li>
                    <li class="item-barra">
                        <a href="/Mensagens/front-end/Mensagens.html">
                            <span class="icone"><i class="bi bi-envelope"></i></span>
                            <span class="txt-link">Mensagens</span>
                        </a>
                    </li>
                    <li class="item-barra">
                        <a href="/Calendario/calendario.html">
                            <span class="icone ativo"><i class="bi bi-clock"></i></span>
                            <span class="txt-link">Atividades</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        
        <div class="header-direita">
            <a href="#l" class="config-link" title="Configurações">
                <i class="bi bi-gear"></i>
            </a>
            <div class="usuario-topo">
                <i class="bi bi-person-circle icone-usuario-branco"></i>
            </div>
        </div>
    </header>

    <div id="calendario" class="wraper" >
        <div class="calendario" >
            <div class="setinhas">
                <button class="anteset" id="anteset">
                    <p>&lt;</p>
                </button>
                <div class="mesAno" id="mesAno"> <input type="month"> </div>
                <button class="postset" id="postset">
                    <p>&gt;</p>
                </button>
            </div>
            <div class="dias_da_semana">
                <span>Dom </span>
                <span>Seg </span>
                <span>Ter </span>
                <span>Qua </span>
                <span>Qui </span>
                <span>Sex </span>
                <span>Sab </span>

            </div>
            <div class="datas" id="datas"></div>

        </div>
    </div>
        
    <script src="../progresso/progresso.js"></script>
    <script src="JS/calendario.js"> </script>    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/progresso/style.css">
    <link rel="stylesheet" href="CSS/calendario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
   <header class="header-topo">
        <div class="header-esquerda">
            <div class="logo-container">
                <a href="../index.html">
                    <img class="icone_site" src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1).png" alt="icone" id="btn-exp">
                </a>
                <span class="logo-texto">Neuro<strong>Core</strong></span>
            </div>
            
            <nav class="menu-navegacao">
                <ul>
                    <li class="item-barra">
                        <a href="/projetos/projetos.html">
                            <span class="icone"><i class="bi bi-house"></i></span>
                            <span class="txt-link">Projetos</span>
                        </a>
                    </li>
                    <li class="item-barra">
                        <a href="/progresso/progresso.html">
                            <span class="icone"><i class="bi bi-clock"></i></span>
                            <span class="txt-link">Kanban</span>
                        </a>
                    </li>
                    <li class="item-barra">
                        <a href="/Mensagens/Mensagens.html">
                            <span class="icone"><i class="bi bi-envelope"></i></span>
                            <span class="txt-link">Mensagens</span>
                        </a>
                    </li>
                    <li class="item-barra">
                        <a href="/Calendario/calendario.html">
                            <span class="icone ativo"><i class="bi bi-table"></i></span>
                            <span class="txt-link">Atividades</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        
        <div class="header-direita">
            <i class="bi bi-bell-fill" id="btn-notf"></i>

            <div class="usuario-topo">
                <a href="#">
                    <i class="bi bi-person-circle icone-usuario-branco ativo" id="btn-usuario"></i>
                </a>

                <ul class="dropdown-menu" id="menuUsuario">
                    <li><a href="/Perfil/perfil.html"><i class="bi bi-person"></i> Meu Perfil</a></li>
                    <li><a href="../configurações/Conta.html"><i class="bi bi-gear"></i> Configurações</a></li>
                    <li><a href="/index.html"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
                </ul>
            </div>
        </div>    
        
        <div class="menu-not" id="barrinha">
            <h3></h3>
            <ul id="lista-notificacoes"></ul> 
        </div>
    </header>

    <div id="calendario" class="wraper" >
        <div class="calendario" >
            <div class="setinhas">
                <button class="anteset" id="anteset">
                    <span>&lt;</span>
                </button>
                <div class="mesAno" id="mesAno"> <input type="month"> </div>
                <button class="postset" id="postset">
                    <span>&gt;</span>
                </button>
            </div>
            <div class="dias_da_semana">
                <span>Dom </span>
                <span>Seg </span>
                <span>Ter </span>
                <span>Qua </span>
                <span>Qui </span>
                <span>Sex </span>
                <span>Sab </span>

            </div>
            <div class="datas" id="datas"></div>
        </div>
        
    </div>  
    <aside id="painel-tarefas" class="painel">
        <div class="painel-header">
            <h3 id="painel-titulo">Tarefas</h3>
            <button id="painel-fechar" aria-label="Fechar painel">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    
        <ul id="lista-tarefas"></ul>
    
        <form id="form-tarefa">
            <input id="input-tarefa" type="text" placeholder="Nova tarefa" required>
            <button type="submit">Adicionar</button>
        </form>
    </aside>

    

    
    <footer class="copyrights">
        <img src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1) 1.png" alt="NeuroCore Mini Logo" width="40">
        <p>&copy; 2026 Neurocore. Todos os direitos reservados.</p>
    </footer>

    <script src="JS/calendario.js"> </script>

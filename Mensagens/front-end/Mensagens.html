<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/progresso/style.css">
    <link rel="stylesheet" href="/Mensagens/front-end/css/mensagens.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="imagens/58e34500-eae7-460e-8223-71d9a443fb6e.ico" type="image/x-icon">
    <title>Mensagens</title>
</head>
<body>
    <section>
        <header class="cabecaralho">
            <div class="cabesa">
                <p class="titulo_area gradient">MENSAGENS</p>

                <h1 class="titulo_proj" >NeuroCore</h1>

            </div>
        </header>
    </section>

    <section>
        <nav class="barra_lateral">
            <a href="/index.html">
                <img class="icone_site" src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1) 1.png" alt="icone">
            </a>
            <ul>
                <li class="item-barra">
                    <a href="/progresso/progresso.html">
                        <span class="icone"><i class="bi bi-house"></i></span>
                        <span class="txt-link">Home</span>
                    </a>
                </li>
                <li class="item-barra">
                    <a href="#">
                        <span class="icone ativo"><i class="bi bi-envelope"></i></span>
                        <span class="txt-link">Mensagem</span>
                    </a>
                </li>
                <li class="item-barra">
                    <a href="/Calendario/calendario.html">
                        <span class="icone"><i class="bi bi-clock"></i></span>
                        <span class="txt-link">Atividade</span>
                    </a>
                </li>
                <li class="item-barra">
                    <a href="#">
                        <span class="icone"><i class="bi bi-folder"></i></span>
                        <span class="txt-link">Arquivos</span>
                    </a>
                </li>
                <li class="item-barra">
                    <a href="#">
                        <span class="icone"><i class="bi bi-gear"></i></span>
                        <span class="txt-link">Configurações</span>
                    </a>
                </li>
            </ul>
        </nav>
           
    </section>

    <section class="chat">
        <section class="chat_messages">

            <div class="message-self">Hello, World!</div>
         
            <div class="message-other">
                <span class="message-sender">RandomName</span>
                Olá, mundo!
            </div>

        </section>
         
        <form class="chat_form">
            <input type="text" class="chat_input" placeholder="Digite uma mensagem" required>
            <button type="submit" class="chat_button">
                <i class="bi bi-send"></i>
            </button>
        </form>

    </section>

    <script src="../progresso/progresso.js"></script>

    
    <script src="/Mensagens/front-end/js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro NeuroCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>

    <header class="header-top">
        <div class="logo-header">
            <img src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1) 1.png" alt="Logo NeuroCore">
            <span>NeuroCore</span>
        </div>
    </header>

    <main class="login-container">
        <h1 class="titulo">CADASTRO</h1>
        <h4 class="subtitulo">Cadastre-se com seu Email</h4>

        <div class="social-login">
            <button type="button" class="btn-google">
                <i class="fa-brands fa-google"></i> Google
            </button>
            <button type="button" class="btn-google">
                <i class="fa-brands fa-github"></i> GitHub
            </button>
        </div>

        <div class="divider">
            <span>OU</span>
        </div>

        <form class="login-form">
            <div class="inputs">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required placeholder="Escreva seu nome">
            </div>

            <div class="inputs">
                <label for="email">E-mail de trabalho</label>
                <input type="email" id="email" required placeholder="Email">
            </div>

            <div class="inputs">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Senha">
            </div>

            <div class="inputs">
                <label for="confirma-senha">Confirme a Senha</label>
                <input type="password" id="confirma-senha" required placeholder="Confirme a Senha">
            </div>

            <button type="submit" class="btn-enviar">Cadastrar</button>
        </form>

        <div class="footer-links">
            <p>Já tem uma conta? <a href="../Login/login.html" class="link-footer">Login aqui!</a></p>
            <p class="termos-texto">
                Ao me cadastrar, eu concordo com os <a href="/termos.html">Termos de serviço</a> e os <a href="/termos.html">Termos específicos do produto</a> da NeuroCore e confirmo estar ciente da <a href="/termos.html">Declaração de privacidade</a>.
            </p>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro NeuroCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>

    <div class="login-container">
        <h1 class="titulo">Bem vindo ao NeuroCore</h1>
        <div class="logo-container">
            <img src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1) 1.png" alt="Cerebro de cor rosa">
        </div>
        <form class="login-form">
            <div class="inputs">
                <label id="label-user" for="username">Nome do usuário</label>
                <input type="text" id="user" required placeholder="Escreva seu nome">
            </div>

            <div class="inputs">
                <label id="label-senha" for="password">Senha</label>
                <input type="password" id="senha" required placeholder="Crie sua senha">
            </div>

            <div class="inputs">
                <label id="label-senha" for="password">Confirmar senha</label>
                <input type="password" id="senha" required placeholder="Confirme sua senha">
            </div>

            <button type="submit" class="btn-enviar">Cadastrar</button>
        </form>

        <div class="footer-links">
            <p>Já tem uma conta? <a href="../Login/login.html" class="link-footer">Login aqui!</a></p>
        </div>
    </div>

</body>
</html>

  <div class="card" id="card1">
    <h2>Cadastro</h2>
    <form>

      <label>Confirmar senha</label>
      <input type="password" placeholder="Confirme sua Senha" id="consenha" required>
      <a href="../home/home.html"><button type="submit">Cadastre-se</button></a>
      <p>Já tem uma conta?
        <a class='cadastro' href="/Login/login.html" >Logue!</a>
      </p>

  </div>
</div>
</div>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="imagens/58e34500-eae7-460e-8223-71d9a443fb6e.ico" type="image/x-icon">
    <title>Progresso - NeuroCore</title>
</head>
<body>
    
    <header class="header-topo">
        <div class="navbar-logo">
            <a href="../index.html" class="logo-container">
                <img class="icone_site" src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1).png" alt="NeuroCore Logo">
                <span class="textologo">Neuro<strong>Core</strong></span>
            </a>
        </div>
        
        <nav class="navbar-links">
            <a href="/projetos/projetos.html"><i class="bi bi-house"></i> Projetos</a>
            <a href="/progresso/progresso.html" class="ativo"><i class="bi bi-clock"></i> Kanban</a>
            <a href="/Mensagens/front-end/Mensagens.html"><i class="bi bi-envelope"></i> Mensagens</a>
            <a href="/Calendario/calendario.html"><i class="bi bi-table"></i> Atividades</a>
        </nav>
        
        <div class="navbar-acoes">
            <div class="usuario-topo">
                <i class="bi bi-person-circle icone-usuario-branco" id="btn-usuario" onclick="toggleMenu(event)"></i>
                <ul class="dropdown-menu" id="menuUsuario">
                    <li><a href="/Perfil/perfil.html"><i class="bi bi-person"></i> Meu Perfil</a></li>
                    <li><a href="../configurações/Conta.html"><i class="bi bi-gear"></i> Configurações</a></li>
                    <li><a href="/index.html"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
                </ul>
            </div>
        </div>
    </header>
    
    <section>
         <div class="conteudo">
            <div class="kanban-container">
                
                <div class="coluna-kanban">
                    <h3>Não Iniciadas</h3>
                    <div class="kanban1">
                        <div class="nada" draggable="true">
                            <img class="user1" src="/imagens/user (3).png" alt="user_kanban">
                            <p>Kanban Parado</p>
                            <div class="gemini-botao" draggable="false">
                                <a href="#">
                                    <img src="/imagens/Google_Gemini_icon_2025.svg.png" alt="Gemini">
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="coluna-kanban">
                    <h3>Em Front-end</h3>
                    <div class="kanban1">
                        <div class="nada" draggable="true">
                            <img class="user2" src="/imagens/user (3).png" alt="user_kanban">
                            <p>Kanban em Progresso</p>
                            <div class="gemini-botao2" draggable="false">
                                <a href="#">
                                    <img src="/imagens/Google_Gemini_icon_2025.svg.png" alt="Gemini">
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="coluna-kanban">
                    <h3>Em Back-End</h3>
                    <div class="kanban1">
                        <div class="nada" draggable="true">
                            <img class="user3" src="/imagens/user (3).png" alt="user_kanban">
                            <p>Kanban Concluído</p>
                            <div class="gemini-botao3" draggable="false">
                                <a href="#">
                                    <img src="/imagens/Google_Gemini_icon_2025.svg.png" alt="Gemini">
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="coluna-kanban">
                    <h3>Em Andamento</h3>
                    <div class="kanban1">
                        <div class="nada" draggable="true">
                            <img class="user4" src="/imagens/user (3).png" alt="user_kanban">
                            <p>Kanban em Andamento</p>
                            <div class="gemini-botao4" draggable="false">
                                <a href="#">
                                    <img src="/imagens/Google_Gemini_icon_2025.svg.png" alt="Gemini">
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="coluna-kanban">
                    <h3>Concluídas</h3>
                    <div class="kanban1">
                        <div class="nada" draggable="true">
                            <img class="user5" src="/imagens/user (3).png" alt="user_kanban">
                            <p>Kanban em Andamento</p>
                            <div class="gemini-botao5" draggable="false">
                                <a href="#">
                                    <img src="/imagens/Google_Gemini_icon_2025.svg.png" alt="Gemini">
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
         </div>
    </section>

    <script src="../progresso/progresso.js"></script>

</html>

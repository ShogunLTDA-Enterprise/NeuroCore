<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login NeuroCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Login/stylelogin.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1) 1.png" alt="Cerebro de cor rosa">
        </div>

        <div class="social-login">
            <button class="btn-social btn-github">
                <i class="fa-brands fa-github" style="color: #ffffff;"></i> Entrar com GitHub
            </button>
            <button class="btn-social btn-google">
                <i class="fa-brands fa-google" style="color: #ffffff;"></i> Entrar com Google
            </button>
        </div>

        <div class="divisor">
            <span>OU</span>
        </div>

        
        <form class="login-form">
            <div class="inputs">
                <label id="label-user" for="username">Nome do usuário</label>
                <input type="text" id="user" required placeholder="Escreva seu nome">
            </div>

            <div class="inputs">
                <label id="label-senha" for="password">Senha</label>
                <input type="password" id="senha" required placeholder="Escreva sua senha">
            </div>

            <button type="submit" class="btn-enviar">Entrar</button>
        </form>

        <div class="footer-links">
            <a href="#" class="link-footer">Esqueceu sua senha?</a>
            <p>Não tem uma conta? <a href="../Cadastro/cadastro.html" class="link-footer">Cadastre-se</a></p>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="../imagens/58e34500-eae7-460e-8223-71d9a443fb6e.ico" type="image/x-icon">
    <link rel="stylesheet" href="/Cadastro/stylecadastro.css">
    <title>Login | NeuroCore</title>
</head>
<body>

    <header class="header-top">
        <div class="logo-header">
            <img src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1) 1.png" alt="Logo NeuroCore">
            <span>Neuro<span class="roxo">Core</span></span>
        </div>
        <a href="../index.html" class="btn-sair">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sair
        </a>
    </header>

    <main class="login-container">
        <h1 class="titulo">LOGIN</h1>
        <h4 class="subtitulo">Faça login com seu e-mail</h4>


        <div class="social-login">
            <button type="button" class="btn-google">
                <i class="fa-brands fa-google"></i> Google
            </button>
            <button type="button" class="btn-google">
                <i class="fa-brands fa-github"></i> GitHub
            </button>
        </div>

        <div class="divider">
            <span>OU</span>
        </div>
        
        <form class="login-form" novalidate>
            <div class="inputs">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Escreva seu e-mail" autocomplete="email">
            </div>

            <div class="inputs">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Escreva sua senha" autocomplete="current-password">
            </div>

            <p id="mensagem-login" class="mensagem-erro" role="alert" hidden></p>

            <button type="submit" class="btn-enviar">Entrar</button>
        </form>

        <div class="footer-links">
            <a href="#" class="link-footer">Esqueceu sua senha?</a>
            <p>Não tem uma conta? <a href="../Cadastro/cadastro.html" class="link-footer">Cadastre-se</a></p>
            <p class="termos-texto">
                Ao me cadastrar, eu concordo com os <a href="/termos.html">Termos de serviço</a> e os <a href="/termos.html">Termos específicos do produto</a> da NeuroCore e confirmo estar ciente da <a href="/termos.html">Declaração de privacidade</a>.
            </p>
        </div>

    </main>

    <script src="js/login.js" defer></script>
</body>
</html>

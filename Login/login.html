<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="stylelogin.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="container" id="container">

        <div class="forma-container">
            <form>
                <h1>Crie uma conta</h1>

                <div class="iconesSite">
                    <a href="#" class="icones"><i class="fa-brands fa-google"></i></a>x'
                    <a href="#" class="icones"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icones"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" class="icones"><i class="fa-brands fa-linkedin"></i></a>
                </div>

                <span>Registre-se com o Email</span>

                <input type="text" placeholder="Nome">
                <input type="email" placeholder="Coloque seu Email">
                <input type="password" placeholder="Coloque sua Senha">

                <button type="submit">Cadastre-se</button> 
            </form>
        </div>

        <!-- Login -->
        <div class="forma-container-login">
            <form>
                <h1>Logue na sua conta</h1>

                <div class="iconesSite">
                    <a href="#" class="icones"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icones"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icones"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#" class="icones"><i class="fa-brands fa-linkedin"></i></a>
                </div>

                <span>Login</span>

                <input type="email" placeholder="Coloque seu Email">
                <input type="password" placeholder="Coloque sua Senha">

                <button type="submit">Login</button> 
            </form>
        </div>

    </div>

    <!-- Painel lateral -->
    <div class="ativar-container">
        <div class="ativar">

            <div class="ativar-painel ativar-esquerda">
                <h1>Bem Vindo ao <br>NeuroCore</h1>
                <p>Logue com Email e Senha</p>
                <button class="escondido" id="login">Login</button>
            </div>

            <div class="ativar-painel ativar-direita">
                <h1>Olá!</h1>
                <p>Junte-se a Nós Para Melhorar o Preparo de Seu Projeto</p>
                <button class="escondido" id="cadastro">Cadastre-se</button>
            </div>

        </div>

        
    </div>

    <script src="script.js"></script>
</body>
</html>

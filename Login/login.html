<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In to CodePen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Login/stylelogin.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1) 1.png" alt="">
        </div>

        <div class="social-login">
            <button class="btn-social btn-github">
                <i class="fa-brands fa-github"></i> Log In with GitHub
            </button>
            <button class="btn-social btn-google">
                <i class="fa-brands fa-google"></i> Log In with Google
            </button>
        </div>

        <div class="separator">
            <span>OR</span>
        </div>

        <form class="login-form">
            <div class="inputs">
                <label id="label-user" for="username">USERNAME OR EMAIL</label>
                <input type="text" id="username" required>
            </div>

            <div class="inputs">
                <label id="label-pass" for="password">PASSWORD</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-enviar">Log In</button>
        </form>

        <div class="footer-links">
            <a href="#" class="link-footer">Forgot Password?</a>
            <a href="#" class="link-footer">Need an account? Sign up now!</a>
        </div>
    </div>

</body>
</html>

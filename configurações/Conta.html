<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações da conta | NeuroCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/Perfil/style.css">
    <link rel="stylesheet" href="config.css">
</head>
<body>

    <header class="header-topo">
        <div class="header-esquerda">
            <div class="logo-container">
                <a href="/index.html"><img class="icone_site" src="/imagens/cérebro-cor-de-rosa-e-roxo-80348150 (1).png" alt="Logo NeuroCore"></a>
                <span class="logo-texto">Neuro<strong>Core</strong></span>
            </div>
            <nav class="menu-navegacao">
                <ul>
                    <li class="item-barra"><a href="/projetos/projetos.html"><span class="icone"><i class="bi bi-house"></i></span><span class="txt-link">Projetos</span></a></li>
                    <li class="item-barra"><a href="/progresso/progresso.html"><span class="icone"><i class="bi bi-table"></i></span><span class="txt-link">Kanban</span></a></li>
                    <li class="item-barra"><a href="/Mensagens/Mensagens.html"><span class="icone"><i class="bi bi-envelope"></i></span><span class="txt-link">Mensagens</span></a></li>
                    <li class="item-barra"><a href="/Calendario/calendario.html"><span class="icone"><i class="bi bi-clock"></i></span><span class="txt-link">Atividades</span></a></li>
                </ul>
            </nav>
        </div>
        <div class="header-direita">
            <div class="usuario-topo">
                <a href="/Perfil/perfil.html" aria-label="Menu do usuário"><i class="bi bi-person-circle icone-usuario-branco" id="btn-usuario" onclick="toggleMenu(event)"></i></a>
                <ul class="dropdown-menu" id="menuUsuario">
                    <li><a href="/Perfil/perfil.html"><i class="bi bi-person"></i> Meu Perfil</a></li>
                    <li><a href="/configurações/Conta.html"><i class="bi bi-gear"></i> Configurações</a></li>
                    <li><a href="/Login/login.html" data-sair><i class="bi bi-box-arrow-right"></i> Sair</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="config-layout">
        <aside class="config-menu" aria-label="Menu de configurações">
            <h2>Configurações</h2>
            <a href="/configurações/Conta.html" aria-current="page">Conta</a>
            <a href="/Perfil/perfil.html">Perfil</a>
        </aside>

        <main class="config-conteudo">
            <h1>Conta</h1>
            <p class="config-sub">Seus dados de acesso e sua senha.</p>

            <section class="config-card" aria-labelledby="titulo-dados">
                <h2 id="titulo-dados">Dados da conta</h2>
                <dl class="info-lista">
                    <dt>E-mail</dt><dd id="info-email">—</dd>
                    <dt>Membro desde</dt><dd id="info-criado">—</dd>
                    <dt>Último acesso</dt><dd id="info-login">—</dd>
                </dl>
            </section>

            <section class="config-card" aria-labelledby="titulo-senha">
                <h2 id="titulo-senha">Trocar senha</h2>
                <form id="form-senha" class="config-form" novalidate>
                    <div class="campo">
                        <label for="senha-atual">Senha atual</label>
                        <input type="password" id="senha-atual" autocomplete="current-password" required>
                    </div>
                    <div class="campo">
                        <label for="nova-senha">Nova senha</label>
                        <input type="password" id="nova-senha" minlength="6" autocomplete="new-password" required>
                    </div>
                    <div class="campo">
                        <label for="confirma-nova-senha">Repita a nova senha</label>
                        <input type="password" id="confirma-nova-senha" minlength="6" autocomplete="new-password" required>
                    </div>
                    <p id="feedback-senha" class="feedback" role="status" hidden></p>
                    <div class="acoes">
                        <button type="submit" class="btn-config" id="btn-senha">Salvar senha</button>
                    </div>
                </form>
            </section>

            <section class="config-card" aria-labelledby="titulo-sessao">
                <h2 id="titulo-sessao">Sair</h2>
                <p>Sai da conta só neste navegador.</p>
                <div class="acoes">
                    <a href="/Login/login.html" class="btn-config secundario" data-sair>Sair</a>
                </div>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="conta.js" defer></script>
</body>
</html>
